[project]
name = "kivo"
version = "0.2.0"
description = "A lightweight desktop teleprompter built with PySide6."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rajtilak Bhattacharjee" },
]
keywords = ["teleprompter", "desktop", "pyside6", "overlay"]
dependencies = [
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pyinstaller>=6.21.0",
]

[project.urls]
Homepage = "https://github.com/rajtilakjee/kivo"
Issues = "https://github.com/rajtilakjee/kivo/issues"

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
